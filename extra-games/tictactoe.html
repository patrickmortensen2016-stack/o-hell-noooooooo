<!DOCTYPE html><html><body style="margin:0;background:#111;color:#fff;font-family:monospace;text-align:center"><h3 id=m>X's turn</h3><div id=b style="display:grid;grid-template-columns:repeat(3,100px);gap:4px;justify-content:center"></div><br><button onclick=r()>Restart</button><script>
let g,p,o;const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function r(){g=Array(9).fill('');p='X';o=0;m.textContent="X's turn";b.innerHTML='';g.forEach((_,i)=>{const e=document.createElement('button');e.style.cssText='height:100px;font-size:48px;background:#222;color:#0ff';e.onclick=()=>{if(o||g[i])return;g[i]=p;e.textContent=p;const w=L.some(l=>l.every(k=>g[k]==p));if(w){m.textContent=p+' wins!';o=1}else if(g.every(v=>v)){m.textContent='Draw';o=1}else{p=p=='X'?'O':'X';m.textContent=p+"'s turn"}};b.appendChild(e)})}
r();</script></body></html>
